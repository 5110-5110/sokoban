<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倉庫番風パズルゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>📦 倉庫番パズル</h1>
    
    <div class="info-panel">
      <div class="info-item">ステージ: <span id="stage-num">1</span></div>
      <div class="info-item">歩数: <span id="move-count">0</span></div>
    </div>

    <!-- パズルの盤面 -->
    <div id="grid" class="grid"></div>

    <div id="message" class="message">すべての荷物を目的地に運ぼう！</div>

    <!-- スマホ・画面操作用ボタン -->
    <div class="controls">
      <div class="row">
        <button onclick="movePlayer(0, -1)">⬆️</button>
      </div>
      <div class="row">
        <button onclick="movePlayer(-1, 0)">⬅️</button>
        <button onclick="movePlayer(1, 0)">➡️</button>
      </div>
      <div class="row">
        <button onclick="movePlayer(0, 1)">⬇️</button>
      </div>
    </div>

    <button class="reset-btn" onclick="resetStage()">やり直す (R)</button>

    <div class="instructions">
      <p>💡 **操作方法**</p>
      <p>キーボードの矢印キー または 画面のボタンで移動</p>
      <p>🤖 プレイヤー | 📦 荷物 | 🎯 目的地</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
