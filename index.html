<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>倉庫番風パズルゲーム</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <h1>📦 倉庫番パズル </h1>
    
    <div class="info-panel">
      <div class="info-item">ステージ: <span id="stage-num">1</span> / 10</div>
      <div class="info-item">手数: <span id="move-count">0</span></div>
    </div>

    <!-- パズルの盤面 -->
    <div id="grid" class="grid"></div>

    <div id="message" class="message">すべての荷物を目的地に運ぼう！</div>

    <!-- 操作ボタン類 -->
    <div class="action-buttons">
      <button class="undo-btn" onclick="undoMove()">↩️ 1手戻す (Z)</button>
      <button class="reset-btn" onclick="resetStage()">🔄 リセット (R)</button>
    </div>

    <div class="controls">
      <div class="row">
        <button onclick="movePlayer(0, -1)">⬆️</button>
      </div>
      <div class="row">
        <button onclick="movePlayer(-1, 0)">⬅️</button>
        <button onclick="movePlayer(1, 0)">➡️</button>
      </div>
      <div class="row">
        <button onclick="movePlayer(0, 1)">⬇️</button>
      </div>
    </div>

    <div class="instructions">
      <p>💡 <b>操作方法</b></p>
      <p>矢印キー / WASD / 画面ボタンで移動</p>
      <p><b>[Z]</b> 1手戻す | <b>[R]</b> リセット</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
